name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64

      - name: Package binary
        run: |
          BINARY=".build/apple/Products/Release/TiltAdmin"
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="tilt-admin-${VERSION}-universal-macos.tar.gz"

          mkdir -p dist/tilt-admin/bin
          cp "$BINARY" dist/tilt-admin/bin/tilt-admin

          tar -czf "$ARCHIVE" -C dist tilt-admin
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          shasum -a 256 "$ARCHIVE" | awk '{print $1}' > sha256.txt
          echo "SHA256=$(cat sha256.txt)" >> "$GITHUB_ENV"

      - name: Attach binary to release
        run: |
          gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew formula
        run: |
          SHA256=$(cat sha256.txt)
          URL="https://github.com/jleagle/tilt-admin/releases/download/v${VERSION}/tilt-admin-${VERSION}-universal-macos.tar.gz"

          cat > formula.rb << FORMULA
          class TiltAdmin < Formula
            desc "Native macOS app for managing Tilt dev services"
            homepage "https://github.com/jleagle/tilt-admin"
            url "${URL}"
            sha256 "${SHA256}"
            version "${VERSION}"

            depends_on :macos

            def install
              bin.install "bin/tilt-admin"
            end

            def caveats
              <<~EOS
                tilt-admin needs a config describing your Tilt service dependencies.
                Create one at ~/.tilt-admin.yml — see
                https://github.com/jleagle/tilt-admin#configuration
              EOS
            end
          end
          FORMULA

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main FETCH_HEAD
          mkdir -p Formula
          cp formula.rb Formula/tilt-admin.rb
          git add Formula/tilt-admin.rb
          git commit -m "Update tilt-admin formula to ${VERSION}"
          git push origin main
