services:
  traefik:
    depends_on: []
    top_level: true
  chargehive-namespace:
    depends_on: [traefik]
  chargehive-db:
    depends_on: [chargehive-namespace]
  chargehive-assemble:
    depends_on: [chargehive-namespace, chargehive-db]
    top_level: true
  chargehive-api:
    depends_on: [chargehive-assemble]
  connector-stripe:
    depends_on: [chargehive-assemble]
    top_level: true
